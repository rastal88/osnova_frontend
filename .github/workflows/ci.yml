name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # API types must match the backend schema (osnova_backend/openapi.json)
      - uses: actions/checkout@v4
        with:
          repository: rastal88/osnova_backend
          path: backend

      - name: API types are up to date
        env:
          OPENAPI_INPUT: backend/openapi.json
        run: |
          npm run generate:client
          git diff --exit-code src/api/generated || {
            echo "::error::src/api/generated is out of date: run npm run generate:client"
            exit 1
          }

      - name: Build
        run: npm run build
