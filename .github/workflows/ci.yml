name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format (Biome)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # API types must match the backend schema (osnova_backend/openapi.json)
      - uses: actions/checkout@v4
        with:
          repository: rastal88/osnova_backend
          path: backend

      # Same path as in local development: the generated types depend on it
      - name: API types are up to date
        run: |
          mkdir -p ../osnova_backend
          cp backend/openapi.json ../osnova_backend/openapi.json
          npm run generate:client
          git diff --exit-code src/api/generated || {
            echo "::error::src/api/generated is out of date: run npm run generate:client"
            exit 1
          }

      - name: Build
        run: npm run build
