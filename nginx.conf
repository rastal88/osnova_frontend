# HSTS only when the proxy in front (HTTPS) says the request came over HTTPS; browsers
# ignore it over plain HTTP anyway
map $http_x_forwarded_proto $hsts {
    https "max-age=31536000";
    default "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Security headers of every page and API answer (CSP, frames, sniffing, referrer):
    # generated at build time by scripts/security-headers.mjs. A location with its own
    # add_header does not inherit them.
    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend service name at request time via Docker's embedded DNS
    # instead of at startup, so nginx does not crash if the backend is briefly
    # unavailable (no more restart loops on cold start).
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend http://backend:8000;

    # Request bodies of the API (forms, JSON); uploads have their own limit below
    client_max_body_size 1m;

    # Forward API requests to the backend service (same origin => no CORS).
    # X-Forwarded-For is replaced, not appended to: the backend trusts its first
    # address for rate limits, so a client must not be able to set it. Behind
    # another proxy (a load balancer, Cloudflare) take the address from it with
    # set_real_ip_from / real_ip_header first.
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File uploads: keep in step with FILES_MAX_SIZE_MB of the backend (default 10)
    location /api/v1/files {
        client_max_body_size 11m;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI / ReDoc / schema served by the backend (DEBUG only). They load their
    # scripts from a CDN, so the site's CSP is not sent here.
    location /docs {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prerendered pages (dist/<language>/<path>/index.html) are served without a
    # trailing-slash redirect, so /en matches its canonical URL; everything else
    # falls back to the Single Page Application (React Router).
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
