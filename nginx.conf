server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend service name at request time via Docker's embedded DNS
    # instead of at startup, so nginx does not crash if the backend is briefly
    # unavailable (no more restart loops on cold start).
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend http://backend:8000;

    # Forward API requests to the backend service (same origin => no CORS).
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI / ReDoc / schema served by the backend.
    location /docs {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prerendered pages (dist/<language>/<path>/index.html) are served without a
    # trailing-slash redirect, so /en matches its canonical URL; everything else
    # falls back to the Single Page Application (React Router).
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
